name: cerebro
description: Headless screenshots, semantics, tap-target and contrast checks, and a tap-by-tap navigation map for Flutter apps, under flutter test. Built for coding agents.
version: 0.1.0
repository: https://github.com/mattparadis/cerebro-flutter
homepage: https://github.com/mattparadis/cerebro-flutter
issue_tracker: https://github.com/mattparadis/cerebro-flutter/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  go_router: ^18.1.1
  args: ^2.7.0
  yaml: ^3.1.4
  path: ^1.9.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_lints: ^6.0.0
