name: ui_map
description: Capture one screenshot per go_router route of a Flutter app headlessly, dump semantics, and build a navigation map for AI agents.
version: 0.1.0
repository: https://github.com/mattparadis/flutter-ui-ux-design-skill
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  go_router: ^18.1.1
  args: ^2.7.0
  yaml: ^3.1.4
  path: ^1.9.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_lints: ^6.0.0
