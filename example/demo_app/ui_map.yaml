# ui_map configuration for the demo app.
devices:
  - { name: phone, width: 393, height: 852, dpr: 3, safe_area: { top: 24, bottom: 24 } }
themes: [light, dark]
platforms: [android]
text_scales: [1.0, 1.3]
settle_ms: 600
export_scale: 2
min_tap_size: 48

routes:
  "/notes/:id": { params: { id: "1" } }
  # URL variants for the states the screen exposes, plus a factory scenario
  # (test/ui_map/app_factory.dart) that reaches the same empty state without
  # any URL hook: the two captures must be pixel-identical.
  "/notes":     { variants: ["?state=empty", "?state=loading", "?state=error"], scenarios: [empty] }
  "/__proto/note-detail": { variants: ["?v=b"] }   # only present with -D UI_PROTO=true

exclude: []
fonts: {}
out_dir: .ui-map
